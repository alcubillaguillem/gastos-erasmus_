<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos Erasmus</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://oawjytdklkqhwtglfbhp.supabase.co wss://oawjytdklkqhwtglfbhp.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de acceso (solo si hay Supabase configurado) -->
  <section id="login" class="screen hidden">
    <div class="login-card">
      <h1>💶 Gastos Erasmus</h1>
      <p class="muted">Entra para sincronizar tus gastos entre el móvil y el ordenador.</p>
      <button type="button" id="google-btn" class="btn google wide">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continuar con Google
      </button>
      <div class="divider"><span>o con email</span></div>
      <form id="login-form">
        <input id="login-email" type="email" placeholder="Email" autocomplete="email" required>
        <input id="login-pass" type="password" placeholder="Contraseña (mín. 8)" autocomplete="current-password" minlength="8" required>
        <button type="submit" class="btn primary">Entrar</button>
        <button type="button" id="signup-btn" class="btn ghost">Crear cuenta</button>
      </form>
      <p id="login-msg" class="msg"></p>
    </div>
  </section>

  <main id="app" class="screen hidden">
    <header class="top">
      <button id="prev-month" class="icon-btn" aria-label="Mes anterior">‹</button>
      <h1 id="month-label">—</h1>
      <button id="next-month" class="icon-btn" aria-label="Mes siguiente">›</button>
      <button id="open-settings" class="icon-btn settings" aria-label="Ajustes">⚙︎</button>
    </header>

    <section class="card summary">
      <div class="summary-row">
        <div>
          <div class="label">Gastado este mes</div>
          <div id="month-total" class="big">0,00 €</div>
        </div>
        <div class="right">
          <div class="label">Hoy</div>
          <div id="today-total" class="mid">0,00 €</div>
        </div>
      </div>
      <div id="budget-box" class="budget hidden">
        <div class="bar"><div id="budget-fill" class="fill"></div></div>
        <div id="budget-text" class="small muted"></div>
      </div>
      <div id="mode-badge" class="small muted"></div>
    </section>

    <section class="card add">
      <form id="add-form" autocomplete="off">
        <div class="amount-row">
          <input id="amount" type="text" inputmode="decimal" placeholder="0,00" aria-label="Importe" required>
          <span class="euro">€</span>
        </div>
        <div id="cat-grid" class="cat-grid" role="radiogroup" aria-label="Categoría"></div>
        <div class="extra-row">
          <input id="note" type="text" placeholder="Nota (opcional)" maxlength="80">
          <input id="date" type="date" aria-label="Fecha">
        </div>
        <button type="submit" class="btn primary wide">Añadir gasto</button>
      </form>
    </section>

    <section class="card">
      <h2>Por categoría</h2>
      <div id="breakdown" class="breakdown"></div>
    </section>

    <section class="card">
      <h2>Movimientos</h2>
      <div id="list" class="list"></div>
    </section>
  </main>

  <!-- Ajustes -->
  <dialog id="settings">
    <form method="dialog" class="sheet">
      <h2>Ajustes</h2>
      <label class="field">Presupuesto mensual (€)
        <input id="budget-input" type="text" inputmode="decimal" placeholder="Ej. 600">
      </label>
      <button type="button" id="save-budget" class="btn primary">Guardar presupuesto</button>

      <hr>
      <button type="button" id="export-csv" class="btn ghost">Exportar a Excel (CSV)</button>

      <div id="shortcut-box" class="hidden">
        <hr>
        <h3>Atajo de Siri / widget</h3>
        <p class="small muted">Copia estos datos en el Atajo de iOS. No compartas el token con nadie.</p>
        <label class="field">URL<input id="sc-url" readonly></label>
        <label class="field">Clave anon<input id="sc-key" readonly></label>
        <label class="field">Token<input id="sc-token" readonly></label>
        <button type="button" id="regen-token" class="btn ghost">Generar token nuevo</button>
      </div>

      <div id="account-box" class="hidden">
        <hr>
        <p id="account-email" class="small muted"></p>
        <button type="button" id="logout" class="btn danger">Cerrar sesión</button>
      </div>

      <hr>
      <button value="close" class="btn">Cerrar</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="vendor/supabase-js-2.117.3.js"></script>
  <script src="app.js"></script>
</body>
</html>
